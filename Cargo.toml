[workspace]
members = [
    "crates/kernel-core",
    "crates/platform-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
thiserror = "2.0"
wasmtime = { version = "=48.0.5", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

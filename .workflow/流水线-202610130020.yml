version: '1.0'
name: game-kernel-rust-ci
displayName: Game Kernel Rust CI

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main

stages:
  - name: rust-ci
    displayName: Rust 检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: rust_checks
        displayName: Rust 格式检查、静态检查与测试
        pythonVersion: 3.9
        commands:
          - |
            set -eu
            export RUSTUP_DIST_SERVER=https://rsproxy.cn
            export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
            wget -qO /tmp/rustup-init.sh https://sh.rustup.rs
            sh /tmp/rustup-init.sh -y --default-toolchain 1.99.0 --profile minimal --component rustfmt --component clippy
            . "$HOME/.cargo/env"
            rustc --version
            cargo fmt --all -- --check
            cargo clippy --locked --workspace --all-targets -- -D warnings
            cargo test --locked --workspace
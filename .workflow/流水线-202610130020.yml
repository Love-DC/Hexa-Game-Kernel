version: '1.0'
name: game-kernel-rust-ci
displayName: Game Kernel Rust CI

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main

stages:
  - name: rust-ci
    displayName: Rust 检查
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: rust_checks
        displayName: 格式检查、静态检查与测试
        hostGroupID: gitee-go
        script: |
          rustc --version
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
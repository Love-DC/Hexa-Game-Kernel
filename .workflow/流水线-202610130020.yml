version: 1.0
name: rust-ci
displayName: Rust 持续集成
triggers:
  push:
    branches:
      include:
        - main
stages:
  - stage:
      name: test
      displayName: 格式检查与测试
      steps:
        - step: run
          name: rust-build
          displayName: 安装 Rust 环境并测试
          script: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            echo "====== 检查代码格式 ======"
            cargo fmt --check
            echo "====== 运行 Clippy 静态检查 ======"
            cargo clippy -- -D warnings
            echo "====== 运行单元测试 ======"
            cargo test